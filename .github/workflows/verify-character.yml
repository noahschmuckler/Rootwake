name: Verify Hulda character sprint
on:
  push:
    branches: [feat/hulda-character]
  pull_request:
    branches: [feat/free-flow]
permissions:
  contents: read
jobs:
  character:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:character
      - run: npm run test:mobility
      - run: npm run test:lab
      - run: node scripts/test-flow.mjs
      - run: npm run build -- --base=/Rootwake/flow/
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-flow.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hulda-character-browser-results
          path: artifacts/flow
