name: Verify and publish the whip (F5a, the practice clearing)
on:
  push:
    branches: [feat/whip]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rootwake-whip
  cancel-in-progress: false
jobs:
  study:
    # Pinned: ubuntu-latest became 26.04 (2026-10), which Playwright 1.58.2 cannot install Chromium's dependencies on.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mobility
      - run: node scripts/test-vista.mjs
      - run: node scripts/test-village.mjs
      - run: npm run build -- --base=/Rootwake/whip/
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      # The runner draws with SwiftShader at a frame or two a second: the low tier keeps each step within its time.
      - run: node scripts/browser-fight.mjs
        env:
          STUDY_BASE: /Rootwake/whip/
          FIGHT_Q: low
      - run: node scripts/browser-whip.mjs
        env:
          STUDY_BASE: /Rootwake/whip/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whip-browser-results
          path: artifacts
      - name: Publish the study to its own folder, leaving every other demo untouched
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          study_checkout=$(mktemp -d)
          git worktree add "$study_checkout" origin/gh-pages
          rm -rf "$study_checkout/whip"
          mkdir -p "$study_checkout/whip/assets"
          cp dist/fight.html "$study_checkout/whip/index.html"
          cp dist/assets/* "$study_checkout/whip/assets/"
          cp -r dist/models "$study_checkout/whip/models"
          # The land baked at build (PLATEAU.md) and the floor's textures: without them the phone erodes the land itself at every load.
          cp -r dist/land "$study_checkout/whip/land"
          if [ -d dist/textures ]; then cp -r dist/textures "$study_checkout/whip/textures"; fi
          printf '{"sourceCommit":"%s","study":"whip-f5a"}\n' "$GITHUB_SHA" > "$study_checkout/whip/revision.json"
          touch "$study_checkout/.nojekyll"
          cd "$study_checkout"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whip .nojekyll
          git commit -m "Publish verified whip ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
      - name: Point Pages at the built gh-pages branch and request its build
        # Since 2026-09-11 the site's source had drifted to feat/broken-conduit, so
        # everything published to gh-pages (root, lab, hulda, conduit, this study)
        # was invisible. Restore the branch source every deploy here assumes.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '[.build_type, .source.branch, .source.path] | join(" ")')
          echo "Pages source before: $source"
          if [ "$source" != "legacy gh-pages /" ]; then
            if ! gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=legacy -f 'source[branch]=gh-pages' -f 'source[path]=/'; then
              echo "::error::Could not switch Pages to the gh-pages branch. In Settings > Pages choose Deploy from a branch, gh-pages, / (root), Save, then re-run this workflow: the built study is already on gh-pages."
              exit 1
            fi
            echo "Pages source now: legacy gh-pages /"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Verify published revision and assets
        env:
          STUDY_COMMIT: ${{ github.sha }}
          STUDY_URL: https://noahschmuckler.github.io/Rootwake/whip/
          STUDY_TITLE: The practice clearing
        run: node scripts/verify-flow-pages.mjs
