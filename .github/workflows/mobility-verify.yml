name: Apply verified mobility refinements
on:
  push:
    branches: [feat/mobility-lab]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply checksummed source refinements
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,existsSync,mkdirSync} from 'node:fs';
          import {dirname} from 'node:path';
          import {brotliDecompressSync} from 'node:zlib';
          import {createHash} from 'node:crypto';
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const changes=JSON.parse(brotliDecompressSync(Buffer.from(readFileSync('.mobility-polish.b64','utf8').trim(),'base64')));
          const pending=[];
          for(const f of changes.files){
            if(!/^(src\/|scripts\/|tests\/|\.github\/workflows\/)/.test(f.path)||f.path.includes('..'))throw new Error('Invalid source path '+f.path);
            const old=existsSync(f.path)?readFileSync(f.path):null;
            if((old?hash(old):null)!==f.before)throw new Error('Changed baseline '+f.path);
            const lines=old?old.toString('utf8').match(/[^\n]*\n|[^\n]+$/g)||[]:[];
            for(const c of [...f.changes].reverse())lines.splice(c.start,c.end-c.start,c.text);
            const text=lines.join('');if(hash(Buffer.from(text))!==f.after)throw new Error('Content checksum '+f.path);
            pending.push([f.path,text]);
          }
          for(const [path,text]of pending){mkdirSync(dirname(path),{recursive:true});writeFileSync(path,text);}
          console.log('Applied '+pending.length+' verified source files.');
          JS
      - run: npm ci
      - run: npm run test:mobility
      - run: npm run test:lab
      - run: npm run build -- --base=/Rootwake/
      - name: Commit verified refinements and remove development transport
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts tests .github/workflows
          git rm -f .mobility-polish.b64 .github/workflows/mobility-verify.yml
          git commit -m 'fix: safe edge landings, portrait course framing and verified all-domain publication'
          git push origin HEAD:feat/mobility-lab
