name: Verify and publish the seeded world preview
on:
  push:
    branches: [feat/seeded-world]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rootwake-seeded-world
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/test-world.mjs
      - run: node scripts/test-village.mjs
      - run: node scripts/test-karst-flow.mjs
      - run: npm run test:mobility
      - run: npm run test:character
      - run: npm run build -- --base=/Rootwake/world/
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-village.mjs
        env:
          STUDY_BASE: /Rootwake/world/
      - run: node scripts/browser-world.mjs
        env:
          STUDY_BASE: /Rootwake/world/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seeded-world-results
          path: artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: seeded-world-build
          path: dist
      # The preview lives beside the village, never over it: /Rootwake/world/ is the village on the
      # shared terrain and root network, /Rootwake/world/planet.html the sphere streaming proof.
      - name: Publish the preview to its own folder, leaving every other demo untouched
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          study_checkout=$(mktemp -d)
          git worktree add "$study_checkout" origin/gh-pages
          mkdir -p "$study_checkout/world/assets"
          cp dist/village.html "$study_checkout/world/index.html"
          cp dist/planet.html "$study_checkout/world/planet.html"
          cp dist/assets/* "$study_checkout/world/assets/"
          rm -rf "$study_checkout/world/models"
          cp -r dist/models "$study_checkout/world/models"
          printf '{"sourceCommit":"%s","study":"world-preview"}\n' "$GITHUB_SHA" > "$study_checkout/world/revision.json"
          touch "$study_checkout/.nojekyll"
          cd "$study_checkout"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world .nojekyll
          git commit -m "Publish verified seeded world preview ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
      - name: Point Pages at the built gh-pages branch and request its build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '[.build_type, .source.branch, .source.path] | join(" ")')
          echo "Pages source before: $source"
          if [ "$source" != "legacy gh-pages /" ]; then
            if ! gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=legacy -f 'source[branch]=gh-pages' -f 'source[path]=/'; then
              echo "::error::Could not switch Pages to the gh-pages branch. In Settings > Pages choose Deploy from a branch, gh-pages, / (root), Save, then re-run this workflow: the built preview is already on gh-pages."
              exit 1
            fi
            echo "Pages source now: legacy gh-pages /"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Verify published revision and assets
        env:
          STUDY_COMMIT: ${{ github.sha }}
          STUDY_URL: https://noahschmuckler.github.io/Rootwake/world/
          STUDY_TITLE: The Village
        run: node scripts/verify-flow-pages.mjs
