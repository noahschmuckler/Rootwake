name: Verify Hulda root vision
on:
  push:
    branches: [feat/hulda-rootvision]
  pull_request:
    paths: ['src/rootvision/**', 'tests/rootvision.test.ts', 'rootvision.html', 'rootvision.config.ts', 'scripts/test-rootvision.mjs']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:roots
      - run: npm run build:roots
      - uses: actions/upload-artifact@v4
        with:
          name: hulda-rootvision-playable
          path: dist-rootvision
