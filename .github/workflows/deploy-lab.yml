name: Deploy lab preview

on:
  push:
    branches: [lab]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rootwake-lab-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out lab
        uses: actions/checkout@v4
        with:
          ref: lab
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build lab
        run: npx vite build --base=/Rootwake/lab/

      - name: Publish /lab to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          tmp=$(mktemp -d)
          git worktree add "$tmp" origin/gh-pages
          rm -rf "$tmp/lab"
          mkdir -p "$tmp/lab"
          cp -r dist/assets "$tmp/lab/assets"
          cp dist/lab.html "$tmp/lab/index.html"
          touch "$tmp/.nojekyll"
          cd "$tmp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Deploy lab: ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
