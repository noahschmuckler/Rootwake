name: Mobility workspace
on:
  push:
    branches: [feat/mobility-lab]
    paths: [.github/workflows/mobility-workspace.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: tar --exclude=.git -czf /tmp/rootwake-workspace.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: mobility-workspace
          path: /tmp/rootwake-workspace.tgz
          retention-days: 1
